<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<script src="../sound.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #faf8ef; color: #776e65; font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
    display: grid; place-items: center; overflow: hidden; user-select: none; touch-action: none;
  }
  .app { width: min(92vw, 92vh - 150px, 480px); }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .head h1 { font-size: clamp(40px, 9vw, 64px); font-weight: 800; color: #776e65; flex: 1; line-height: 1; }
  .score { background: #bbada0; color: #fff; padding: 6px 14px; text-align: center; min-width: 74px; border-radius: 4px; }
  .score span { display: block; font-size: 11px; font-weight: 700; color: #eee4da; letter-spacing: .05em; }
  .score b { font-size: 20px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; font-size: 14px; }
  .bar button { font: inherit; font-weight: 700; padding: 8px 14px; background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 4px; cursor: pointer; }
  .bar button:hover { background: #9f8b77; }
  .bar button:disabled { opacity: .45; cursor: default; }
  .board { position: relative; aspect-ratio: 1; background: #bbada0; border-radius: 8px; padding: 3%; }
  .cells { position: absolute; inset: 3%; display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr); gap: 3.2%; }
  .cells div { background: rgba(238,228,218,.35); border-radius: 4px; }
  .tiles { position: absolute; inset: 3%; }
  .tile {
    position: absolute; width: 22.6%; height: 22.6%; border-radius: 4px;
    display: grid; place-items: center; font-weight: 800; font-size: var(--fs);
    transition: left .1s ease-in-out, top .1s ease-in-out;
  }
  .tile.new { animation: appear .2s ease .08s backwards; }
  .tile.merged { animation: pop .2s ease .08s; z-index: 2; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 50% { transform: scale(1.2); } }
  .msg {
    position: absolute; inset: 0; background: rgba(238,228,218,.75); border-radius: 8px; z-index: 5;
    display: none; place-items: center; text-align: center; animation: fade .6s;
  }
  .msg.show { display: grid; }
  .msg.win { background: rgba(237,194,46,.55); color: #f9f6f2; }
  @keyframes fade { from { opacity: 0; } }
  .msg h2 { font-size: clamp(32px, 8vw, 56px); font-weight: 800; margin-bottom: 14px; }
  .msg button { font: inherit; font-weight: 700; padding: 10px 18px; background: #8f7a66; color: #f9f6f2; border: 0; border-radius: 4px; cursor: pointer; margin: 0 4px; }
  .tip { margin-top: 12px; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>2048</h1>
    <div class="score"><span>SCORE</span><b id="score">0</b></div>
    <div class="score"><span>BEST</span><b id="best">0</b></div>
  </div>
  <div class="bar">
    <span>Join the tiles, get to <b>2048!</b></span>
    <span><button id="undo" disabled>Undo</button> <button id="new">New game</button></span>
  </div>
  <div class="board" id="board">
    <div class="cells"></div>
    <div class="tiles" id="tiles"></div>
    <div class="msg" id="msg"><div><h2 id="msgText">Game over!</h2><div id="msgBtns"></div></div></div>
  </div>
  <div class="tip">Arrows or WASD to slide · Swipe on touch screens · U to undo · R for new game</div>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = {
  2: ["#eee4da", "#776e65"], 4: ["#ede0c8", "#776e65"], 8: ["#f2b179", "#f9f6f2"], 16: ["#f59563", "#f9f6f2"],
  32: ["#f67c5f", "#f9f6f2"], 64: ["#f65e3b", "#f9f6f2"], 128: ["#edcf72", "#f9f6f2"], 256: ["#edcc61", "#f9f6f2"],
  512: ["#edc850", "#f9f6f2"], 1024: ["#edc53f", "#f9f6f2"], 2048: ["#edc22e", "#f9f6f2"]
};
document.querySelector(".cells").innerHTML = "<div></div>".repeat(16);

let grid, score, best, won, keepGoing, over, prev, nextId = 1;
try { best = +localStorage.getItem("2048-best") || 0; } catch (e) { best = 0; }

function empty() { const r = []; for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (!grid[y][x]) r.push([x, y]); return r; }
function addTile() {
  const e = empty(); if (!e.length) return;
  const [x, y] = e[Math.floor(Math.random() * e.length)];
  grid[y][x] = { v: Math.random() < .9 ? 2 : 4, id: nextId++, isNew: true };
}
function snapshot() { return { grid: grid.map(r => r.map(t => t && { v: t.v, id: t.id })), score }; }

function newGame() {
  grid = Array.from({ length: 4 }, () => Array(4).fill(null));
  score = 0; won = false; keepGoing = false; over = false; prev = null;
  addTile(); addTile();
  $("msg").className = "msg"; $("undo").disabled = true;
  render();
}

function slide(dir) {
  if (over || (won && !keepGoing)) return;
  const before = snapshot();
  const vec = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir];
  const xs = [0, 1, 2, 3], ys = [0, 1, 2, 3];
  if (vec[0] === 1) xs.reverse();
  if (vec[1] === 1) ys.reverse();
  let moved = false, merged = false, gained = 0;
  grid.forEach(r => r.forEach(t => { if (t) { t.isNew = false; t.merged = false; t.mergedFrom = null; } }));
  for (const y of ys) for (const x of xs) {
    const t = grid[y][x]; if (!t) continue;
    let cx = x, cy = y;
    while (true) {
      const nx = cx + vec[0], ny = cy + vec[1];
      if (nx < 0 || ny < 0 || nx > 3 || ny > 3) break;
      const o = grid[ny][nx];
      if (!o) { cx = nx; cy = ny; continue; }
      if (o.v === t.v && !o.merged) {
        grid[y][x] = null;
        const m = { v: t.v * 2, id: nextId++, merged: true, mergedFrom: [o, { ...t, x: nx, y: ny }] };
        grid[ny][nx] = m; gained += m.v; merged = true; moved = true;
        if (m.v === 2048 && !won) won = true;
        cx = null; break;
      }
      break;
    }
    if (cx !== null && (cx !== x || cy !== y)) { grid[y][x] = null; grid[cy][cx] = t; moved = true; }
  }
  if (!moved) return;
  prev = before; $("undo").disabled = false;
  score += gained;
  if (score > best) { best = score; try { localStorage.setItem("2048-best", best); } catch (e) {} }
  SFX.play(merged ? "merge" : "slide");
  addTile();
  render();
  if (won && !keepGoing) setTimeout(() => { SFX.play("win"); showMsg("You win!", true); }, 300);
  else if (!canMove()) { over = true; setTimeout(() => { SFX.play("die"); showMsg("Game over!", false); }, 400); }
}
function canMove() {
  if (empty().length) return true;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const v = grid[y][x].v;
    if ((x < 3 && grid[y][x + 1].v === v) || (y < 3 && grid[y + 1][x].v === v)) return true;
  }
  return false;
}
function showMsg(text, isWin) {
  $("msgText").textContent = text;
  $("msg").className = "msg show" + (isWin ? " win" : "");
  $("msgBtns").innerHTML = (isWin ? '<button id="keep">Keep going</button>' : "") + '<button id="again">Try again</button>';
  $("again").onclick = newGame;
  if (isWin) $("keep").onclick = () => { keepGoing = true; $("msg").className = "msg"; };
}
function undo() {
  if (!prev) return;
  grid = prev.grid.map(r => r.map(t => t && { ...t })); score = prev.score; prev = null;
  over = false; $("msg").className = "msg"; $("undo").disabled = true;
  render(true);
}

/* Tiles are positioned by id so they slide smoothly between cells */
const els = new Map();
function place(el, x, y) { el.style.left = (x * 25.8) + "%"; el.style.top = (y * 25.8) + "%"; }
function style(el, v) {
  const [bg, fg] = COLORS[v] || ["#3c3a32", "#f9f6f2"];
  el.style.background = bg; el.style.color = fg;
  const w = $("tiles").clientWidth / 4.4;
  el.style.setProperty("--fs", (v < 100 ? w * .5 : v < 1000 ? w * .42 : w * .33) + "px");
  if (v >= 128) el.style.boxShadow = `0 0 ${Math.min(30, v / 40)}px rgba(243,215,116,.5)`;
  el.textContent = v;
}
function render(instant) {
  const keep = new Set();
  const make = (t, x, y, cls) => {
    let el = els.get(t.id);
    if (!el) { el = document.createElement("div"); el.className = "tile" + cls; $("tiles").appendChild(el); els.set(t.id, el); place(el, x, y); }
    style(el, t.v); keep.add(t.id);
    return el;
  };
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const t = grid[y][x]; if (!t) continue;
    if (t.mergedFrom && !instant) {
      t.mergedFrom.forEach(src => { const el = els.get(src.id); if (el) { place(el, x, y); keep.add(src.id); setTimeout(() => { el.remove(); els.delete(src.id); }, 110); } });
      const el = make(t, x, y, " merged"); el.style.zIndex = 2;
    } else {
      const el = make(t, x, y, t.isNew && !instant ? " new" : "");
      requestAnimationFrame(() => place(el, x, y));
    }
  }
  for (const [id, el] of els) if (!keep.has(id)) { el.remove(); els.delete(id); }
  if (instant) for (const el of els.values()) el.className = "tile";
  $("score").textContent = score; $("best").textContent = best;
}

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const map = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowup: "up", w: "up", arrowdown: "down", s: "down" };
  if (map[k]) { e.preventDefault(); slide(map[k]); }
  if (k === "r") newGame();
  if (k === "u" || (k === "z" && (e.ctrlKey || e.metaKey))) undo();
});
let t0 = null;
$("board").addEventListener("pointerdown", e => { t0 = [e.clientX, e.clientY]; });
addEventListener("pointerup", e => {
  if (!t0) return;
  const dx = e.clientX - t0[0], dy = e.clientY - t0[1]; t0 = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  slide(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
$("new").onclick = () => { newGame(); $("new").blur(); };
$("undo").onclick = () => { undo(); $("undo").blur(); };
addEventListener("resize", () => render(true));
newGame();
</script>
</body>
</html>
