<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Link preview (Discord etc.): image only -->
<meta property="og:type" content="website">
<meta property="og:url" content="http://cpsedchsw.site/">
<meta property="og:image" content="http://cpsedchsw.site/images/dog.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1339">
<meta property="og:image:height" content="1278">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="http://cpsedchsw.site/images/dog.jpg">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden; }
  .bg {
    position: fixed; inset: -40px;
    background: url("images/dog.jpg") center / cover no-repeat;
    filter: blur(30px) brightness(.6);
  }
  img {
    position: fixed; inset: 0; margin: auto;
    max-width: 100%; max-height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <img src="images/dog.jpg" alt="A happy dog in a bubble bath holding a glass of wine">
</body>
</html>
